services:
  shutter:
    build:
      args:
        NETWORK: chiado
        CHAIN_PORT: 27656
        KEYPER_PORT: 24003
        KEYPER_METRICS_PORT: 9200
        ASSETS_VERSION: shutter-api-chiado-1000-v0.0.2
    ports:
      - "24003:23003"
      - "27656:26656"
      - "27660:26660"
      - "9200:9100"

  metrics:
    build:
      args:
        NETWORK: chiado
        ASSETS_VERSION: shutter-api-chiado-1000-v0.0.2